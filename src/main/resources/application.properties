spring.application.name=web_peliculas
server.port=8081
server.servlet.context-path=/cineplay
server.forward-headers-strategy=native
app.peliculas.directorio=${APP_PELICULAS_DIR:/srv/peliculas}
spring.datasource.url=jdbc:h2:file:./data/BD_peliculas
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=adm
spring.datasource.password=
spring.sql.init.platform=h2
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.admin.username=admin
app.admin.password=${ADMIN_PASSWORD}
